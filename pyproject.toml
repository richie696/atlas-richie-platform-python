[tool.uv]
required-version = ">=0.12,<0.13"

[tool.uv.workspace]
members = [
  "foundation/contracts",
  "foundation/testing",
  "foundation/platform",
  "components/http",
  "components/mcp",
  "components/oauth",
  "components/resilience",
  "components/cache/cache-core",
  "components/cache/cache-redis",
]

[tool.uv.sources]
atlas-richie-contracts = { workspace = true }
atlas-richie-http = { workspace = true }
atlas-richie-mcp = { workspace = true }
atlas-richie-oauth = { workspace = true }
atlas-richie-resilience = { workspace = true }
atlas-richie-cache-core = { workspace = true }
atlas-richie-cache-redis = { workspace = true }
atlas-richie-testing = { workspace = true }

[tool.atlas-richie]
python-baseline = "3.12"
stable-python = ["3.12", "3.13", "3.14"]
next-python = "3.15"
