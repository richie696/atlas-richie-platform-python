name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-groups
      - run: uv lock --check
      - run: uv build --all-packages
      - run: uv run python tools/release/verify_isolated_wheels.py
      - uses: pypa/gh-action-pypi-publish@release/v1
