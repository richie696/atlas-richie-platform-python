name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # VERSIONING.md defines the stable support window as CPython 3.12 / 3.13 /
    # 3.14 — those must pass. The next CPython release (3.15) is an
    # allowed-failure compatibility signal until it becomes stable, so a 3.15
    # failure must not turn the workflow red.
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # --all-extras: the pytest suites need optional dependencies (`jose` → joserfc,
      # `test` → pytest/fastapi/uvicorn) that a plain sync does not install.
      - run: uv sync --all-packages --all-groups --all-extras
      - run: uv lock --check
      - run: uv run python tools/dependency-check/check_core_imports.py
      # pytest, not `unittest discover`: these suites mix unittest.TestCase with
      # pytest-style modules (fixtures, importorskip, package-relative imports).
      # unittest silently ran none of the pytest-style tests and could not even
      # import the ones using relative imports.
      - run: uv run python -m pytest components/http/tests -q
      - run: uv run python -m pytest components/oauth/tests -q
      - run: uv run python -m pytest components/mcp/tests -q
      - run: uv run python -m pytest components/chunking -q
      - run: uv run python -m pytest components/desensitize -q
      - run: uv run python -m pytest components/mfa -q
      - run: uv run python -m pytest components/web -q
      - run: uv run python -m pytest components/statemachine -q
      - run: uv run python -m pytest components/redis-streammq -q
      - run: uv run python -m pytest components/scheduling -q
      - run: uv run python -m pytest components/coordination -q
      - run: uv run python -m pytest components/persistence -q
      - run: uv run python -m pytest components/document -q
      - run: uv run python -m pytest components/storage -q
      - run: uv run python -m pytest components/vector -q
      - run: uv run python -m pytest components/tenant -q
      - run: uv run python -m pytest components/concurrency -q
      # Per-package invocations: each package is its own pytest rootdir. Running
      # several in one invocation collides on the `tests.conftest` module name.
      # sentinel-source-file is omitted because it has no tests (pytest exits 5).
      # Vault/OpenBao suites skip cleanly when no server is reachable; the
      # pgvector suite does the same when no PostgreSQL + pgvector is reachable.
      - run: |
          for d in \
            components/cache \
            foundation/httpx-env/tests \
            foundation/testing/tests \
            components/secret/*/tests \
            components/sentinel/sentinel-adapter-asgi/tests \
            components/sentinel/sentinel-adapter-httpx/tests \
            components/sentinel/sentinel-reporter-v2/tests \
            components/sentinel/sentinel-reporter-incidents/tests \
            components/sentinel/sentinel-reporter-rules/tests \
            components/sentinel/sentinel-dashboard/tests \
            components/sentinel/sentinel-cluster/tests \
            components/sentinel/sentinel-source-nacos/tests ; do
            uv run python -m pytest "$d" -q
          done
      - run: uv build --all-packages
      - run: uv run python tools/release/prepare_wheelhouse.py
      - run: uv run python tools/release/verify_isolated_wheels.py

  sentinel-contracts:
    name: sentinel-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-groups
      - run: uv run --locked --package atlas-richie-sentinel --extra test python -m pytest components/sentinel/sentinel/tests -q
      - run: uv run --locked --package atlas-richie-contracts --extra test python -m pytest foundation/contracts/tests -q
      # The console suite runs the independent console project, so it needs its
      # own lock file and cannot share the workspace environment. Publish the
      # pytest failure list as workflow annotations: the job log is only
      # readable after a signed-in session, but annotations stay visible to
      # anyone watching the run.
      - name: Run the Sentinel Console suite
        working-directory: components/sentinel/sentinel-console
        run: |
          set +e
          log_file="${RUNNER_TEMP}/sentinel-console-pytest.log"
          uv run --locked --extra test python -m pytest -q 2>&1 | tee "$log_file"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$pytest_status" -ne 0 ]]; then
            grep -E '^(FAILED|ERROR) ' "$log_file" | head -9 | while IFS= read -r failure; do
              escaped="$(printf '%s' "$failure" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
              printf '::error title=Sentinel Console pytest failure::%s\n' "$escaped"
            done
            summary="$(tail -n 30 "$log_file" | tr '\n' ' ')"
            escaped_summary="$(printf '%s' "$summary" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            printf '::error title=Sentinel Console pytest summary::%s\n' "$escaped_summary"
          fi
          exit "$pytest_status"
