name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages --all-groups
      - run: uv lock --check
      - run: uv run python tools/dependency-check/check_core_imports.py
      - run: uv run python -m unittest discover -s components/http/tests -v
      - run: uv run python -m unittest discover -s components/oauth/tests -v
      - run: uv run python -m unittest discover -s components/mcp/tests -v
      - run: uv run python -m unittest discover -s adapters -p 'test_*.py' -v
      - run: uv build --all-packages
      - run: uv run python tools/release/verify_isolated_wheels.py
