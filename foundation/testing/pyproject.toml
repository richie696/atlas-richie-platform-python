[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-testing"
version = "0.1.0"
description = "Reusable test fixtures and contract assertions for Atlas Richie components."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = [
    "atlas-richie-contracts>=0.1.0,<0.2.0",
]
[project.license]
text = "Apache-2.0"

[tool.uv.build-backend]
module-name = "atlas_richie.testing"
module-root = "src"
