[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-platform"
version = "0.2.0"
description = "Compatibility installation entry point for verified Atlas Richie Python components."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = [
  "atlas-richie-cache-core>=0.2.0,<0.3.0",
  "atlas-richie-cache-redis>=0.2.0,<0.3.0",
  "atlas-richie-chunking-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "atlas-richie-desensitize-core>=0.2.0,<0.3.0",
  "atlas-richie-http>=0.2.0,<0.3.0",
  "atlas-richie-mfa-validation>=0.2.0,<0.3.0",
  "atlas-richie-httpx-env>=0.2.0,<0.3.0",
  "atlas-richie-mcp>=0.2.0,<0.3.0",
  "atlas-richie-oauth>=0.2.0,<0.3.0",
  "atlas-richie-secret-aliyun-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-aws-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-azure-keyvault>=0.2.0,<0.3.0",
  "atlas-richie-secret-baidu-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-barbican>=0.2.0,<0.3.0",
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-secret-gcp-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-huawei-csms-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-ibm-key-protect>=0.2.0,<0.3.0",
  "atlas-richie-secret-kmip>=0.2.0,<0.3.0",
  "atlas-richie-secret-oci-vault-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-openbao>=0.2.0,<0.3.0",
  "atlas-richie-secret-pkcs11>=0.2.0,<0.3.0",
  "atlas-richie-secret-redis>=0.2.0,<0.3.0",
  "atlas-richie-secret-rotation-daemon>=0.2.0,<0.3.0",
  "atlas-richie-secret-tencent-ssm-kms>=0.2.0,<0.3.0",
  "atlas-richie-secret-vault>=0.2.0,<0.3.0",
  "atlas-richie-secret-volcengine-kms>=0.2.0,<0.3.0",
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-adapter-asgi>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-adapter-httpx>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-cluster>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-dashboard>=0.3.0,<0.4.0",
  "atlas-richie-sentinel-reporter-incidents>=0.1.0,<0.2.0",
  "atlas-richie-sentinel-reporter-rules>=0.1.0,<0.2.0",
  "atlas-richie-sentinel-reporter-v2>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-source-file>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-source-nacos>=0.2.0,<0.3.0",
  "atlas-richie-testing>=0.2.0,<0.3.0",
]
[project.license]
text = "Apache-2.0"

[tool.uv.build-backend]
module-name = "atlas_richie.platform"
module-root = "src"
