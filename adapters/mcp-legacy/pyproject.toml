[project]
name = "atlas-richie-mcp-legacy"
version = "0.2.0"
description = "Optional MCP 2025-11-25 legacy dialect adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "atlas-richie-mcp>=0.2.0,<0.3.0",
]

[project.license]
text = "Apache-2.0"

[tool.uv.sources.atlas-richie-mcp]
workspace = true

[tool.uv.build-backend]
module-name = "atlas_richie.mcp_legacy"
module-root = "src"

[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"
