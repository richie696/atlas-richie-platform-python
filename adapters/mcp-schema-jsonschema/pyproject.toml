[project]
name = "atlas-richie-mcp-schema-jsonschema"
version = "0.1.0"
description = "Draft 2020-12 JSON Schema adapter for atlas-richie-mcp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "atlas-richie-mcp>=0.1.0,<0.2.0",
    "jsonschema>=4.25,<5",
]

[project.license]
text = "Apache-2.0"

[tool.uv.sources.atlas-richie-mcp]
workspace = true

[tool.uv.build-backend]
module-name = "atlas_richie.mcp_schema_jsonschema"
module-root = "src"

[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"
