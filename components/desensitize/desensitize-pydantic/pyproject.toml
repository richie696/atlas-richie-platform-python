[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-desensitize-pydantic"
version = "0.2.0"
description = "Pydantic v2 response masking: field-level Sensitive markers via Annotated, name-based rules, nested models — for the API_RESPONSE scene."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = [
  "atlas-richie-desensitize-core>=0.2.0,<0.3.0",
  "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.license]
text = "Apache-2.0"

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: multi-component interaction, may use real backends",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.desensitize_pydantic"
module-root = "src"
