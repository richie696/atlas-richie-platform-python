[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-chunking-parser-adapter"
version = "0.2.0"
description = "Bridge from document-parser events to chunking, preserving per-chunk source spans for RAG provenance."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = [
  "atlas-richie-chunking-core>=0.2.0,<0.3.0",
  "atlas-richie-document-parser>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.license]
text = "Apache-2.0"

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: multi-component interaction, may use real backends",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.chunking_parser_adapter"
module-root = "src"