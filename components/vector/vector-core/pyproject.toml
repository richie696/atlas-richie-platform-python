[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-vector-core"
version = "0.2.0"
description = "Vector retrieval contracts: filter AST, ACL pre-filter, query resolution, MMR diversification and capability topology."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.license]
text = "Apache-2.0"

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: multi-component interaction, may use a real database",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.vector_core"
module-root = "src"