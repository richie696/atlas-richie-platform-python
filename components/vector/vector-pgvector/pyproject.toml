[build-system]
requires = [
    "uv_build>=0.12,<0.13",
]
build-backend = "uv_build"

[project]
name = "atlas-richie-vector-pgvector"
version = "0.2.0"
description = "PostgreSQL + pgvector adapter for the vector retrieval SPI (parameterized JSONB ACL pushdown, HNSW/IVFFlat)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Atlas Richie" },
]
dependencies = [
  "atlas-richie-vector-core>=0.2.0,<0.3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "atlas-richie-testing>=0.2.0,<0.3.0"]

[project.license]
text = "Apache-2.0"

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: multi-component interaction, may use a real PostgreSQL",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.vector_pgvector"
module-root = "src"