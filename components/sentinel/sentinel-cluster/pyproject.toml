[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-cluster"
version = "0.2.0"
description = "Atlas Richie Sentinel — distributed cluster mode. Multi-process token quota / lease coordination for Flow admission. Wire contract: docs/CLUSTER_TOKEN_PROTOCOL.md V1 (HTTP/1.1 + JSON). Mirrors Java sentinel-cluster architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.21,<1.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O (default)",
    "integration: requires a real cluster server (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_cluster"
module-root = "src"
