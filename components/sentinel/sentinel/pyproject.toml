[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel"
version = "0.2.0"
description = "Atlas Richie Sentinel — flow control, circuit breaking, system protection, and resource governance for Python services. Main wheel of the Sentinel family; zero third-party runtime dependencies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.21,<1.0"]
docs = ["mkdocs>=1.5,<2.0", "mkdocs-material>=9.0,<10.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel"
module-root = "src"
