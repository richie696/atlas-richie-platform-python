[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-dashboard"
version = "0.3.0"
description = "Atlas Richie Sentinel — per-process embedded admin Dashboard (loopback REST + HTML UI; v2 Starlette + Jinja2 + uvicorn)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Framework :: ASGI",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "starlette>=0.40,<2.0",
  "jinja2>=3.0,<4.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
prod = ["hypercorn>=0.16,<1.0"]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.21,<1.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_dashboard"
module-root = "src"
