[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-source-file"
version = "0.2.0"
description = "Atlas Richie Sentinel — file-based rule source. Load Flow / Degrade / ParamFlow / System / Authority rules from YAML or JSON files. Hot-reload on file change."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "pyyaml>=6.0,<7.0",
  "watchfiles>=0.21,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O (default)",
    "integration: requires filesystem watchers (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_source_file"
module-root = "src"
