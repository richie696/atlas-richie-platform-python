events {}

http {
  access_log off;
  # Docker Desktop publishes host.docker.internal as both A and AAAA records.
  # The Nacos host listener is IPv4-only, so force the container resolver to
  # choose the reachable IPv4 address for each proxied request.
  resolver 127.0.0.11 ipv6=off valid=30s;

  server {
    listen 9443 ssl;
    server_name 127.0.0.1;
    set $nacos_host host.docker.internal;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /nacos/v3/auth/user/login {
      limit_except POST { deny all; }
      proxy_pass http://$nacos_host:8848;
      proxy_set_header Host host.docker.internal;
      proxy_set_header Connection close;
      proxy_http_version 1.1;
    }

    location = /nacos/v3/admin/cs/config/list {
      limit_except GET { deny all; }
      proxy_pass http://$nacos_host:8848;
      proxy_set_header Host host.docker.internal;
      proxy_set_header Connection close;
      proxy_http_version 1.1;
    }

    location = /nacos/v3/admin/cs/config {
      limit_except GET { deny all; }
      proxy_pass http://$nacos_host:8848;
      proxy_set_header Host host.docker.internal;
      proxy_set_header Connection close;
      proxy_http_version 1.1;
    }

    # This temporary route is used only for the explicitly authorized,
    # single-item T05.4 acceptance config. The bridge is loopback-only and the
    # route will be removed after that one-time publish operation.
    location = /nacos/v3/admin/cs/config/import {
      limit_except POST { deny all; }
      client_max_body_size 2m;
      proxy_pass http://$nacos_host:8848;
      proxy_set_header Host host.docker.internal;
      proxy_set_header Connection close;
      proxy_http_version 1.1;
    }

    location / {
      return 404;
    }
  }
}
