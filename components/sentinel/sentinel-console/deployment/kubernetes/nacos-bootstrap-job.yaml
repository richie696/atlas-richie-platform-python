apiVersion: batch/v1
kind: Job
metadata:
  name: nacos-bootstrap
  namespace: sentinel-e2e-infra-20261018
  labels:
    app.kubernetes.io/name: nacos-bootstrap
    app.kubernetes.io/part-of: atlas-richie-sentinel-e2e
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: __SENTINEL_REGISTRY_HOST__/sentinel-acceptance/busybox:1.36-amd64@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              endpoint="http://nacos:8848/nacos/v3/auth/user"
              deadline=$(( $(date +%s) + 240 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                response=""
                if response="$(wget -q -O - --post-data="password=${NACOS_PASSWORD}" \
                  "${endpoint}/admin" 2>/dev/null)" \
                  && printf '%s' "$response" | grep -Eq '"code"[[:space:]]*:[[:space:]]*0'; then
                  echo "Nacos first administrator initialized"
                  exit 0
                fi

                response=""
                if response="$(wget -q -O - --post-data="username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}" \
                  "${endpoint}/login" 2>/dev/null)" \
                  && printf '%s' "$response" | grep -Eq '"accessToken"[[:space:]]*:[[:space:]]*"[^"]+"'; then
                  echo "Nacos administrator already initialized and credentials verified"
                  exit 0
                fi
                sleep 2
              done

              echo "Nacos administrator bootstrap/login failed; credentials are not logged" >&2
              exit 1
          env:
            - name: NACOS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nacos-bootstrap-credentials
                  key: username
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nacos-bootstrap-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
