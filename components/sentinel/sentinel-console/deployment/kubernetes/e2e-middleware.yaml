apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinel-e2e-infra-20261018
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
            labels:
              environment: sentinel-e2e
      - job_name: sentinel-e2e-node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [sentinel-e2e-infra-20261018]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: sentinel-node-exporter
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9100"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: host_id
          - target_label: environment
            replacement: sentinel-e2e
---
