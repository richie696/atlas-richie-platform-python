  name: postgres
  namespace: sentinel-t003-console-20261019
  labels:
    app.kubernetes.io/name: sentinel-acceptance-postgres
    app.kubernetes.io/part-of: atlas-richie-sentinel-acceptance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-acceptance-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-acceptance-postgres
        app.kubernetes.io/part-of: atlas-richie-sentinel-acceptance
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: __SENTINEL_REGISTRY_HOST__/sentinel-e2e/postgres:16.10@sha256:2c72031ac25606bf94fd2fece7c35efdf263a48b08446950034f0725653f4efc
          imagePullPolicy: Always
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres/tls/tls.key
          env:
