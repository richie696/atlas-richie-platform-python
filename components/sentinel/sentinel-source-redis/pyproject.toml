[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-source-redis"
version = "0.2.0"
description = "Atlas Richie Sentinel — Redis pub/sub-based rule source. Push rules to a Redis channel; subscribers hot-reload. Lightweight alternative to Nacos for distributed deployments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-core>=0.0.1a1,<1.0",
  "atlas-richie-sentinel-rules>=0.0.1a1,<1.0",
  "redis>=5.0,<9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O (default)",
    "integration: requires a real Redis server (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_source_redis"
module-root = "src"
