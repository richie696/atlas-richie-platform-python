[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-adapter-asgi"
version = "0.2.0"
description = "Atlas Richie Sentinel — ASGI ingress adapter. Wraps any ASGI app with SystemSlot + worker-pool guard + per-route Flow/Degrade rules. Mirrors Java sentinel-spring-cloud-gateway-adapter for Python ASGI services (FastAPI, Starlette, Quart)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Framework :: Starlette",
]
dependencies = [
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "atlas-richie-sentinel>=0.2.0,<0.3.0",
  "atlas-richie-sentinel-source-file>=0.0.1a1,<1.0",
  "starlette>=0.30,<1.0",
  "psutil>=5.9,<6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.21,<1.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O (default)",
    "integration: requires a real ASGI server (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_adapter_asgi"
module-root = "src"
