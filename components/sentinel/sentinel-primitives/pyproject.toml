[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-sentinel-primitives"
version = "0.2.0"
description = "Atlas Richie Sentinel — low-level resilience primitives (retry, circuit-breaker, rate-limit, bulkhead, idempotency-key, clock). Foundation layer for the Sentinel family; minimal third-party dependencies (stamina + aiolimiter)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "stamina>=0.10,<30.0",
  "aiolimiter>=1.1,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.21,<1.0"]
docs = ["mkdocs>=1.5,<2.0", "mkdocs-material>=9.0,<10.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.sentinel_primitives"
module-root = "src"
