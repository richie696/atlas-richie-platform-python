[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-vault"
version = "0.2.0"
description = "HashiCorp Vault backend for the Atlas Richie secret platform. Implements the SecretProviderFactory + KeyWrappingBackend + SigningBackend + SecretBootstrapClient + SecretProviderSession contract roles over a single hvac client; mirrors Java atlas-richie-secret-provider-vault 1:1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "hvac>=2.4,<3.0",
  "cryptography>=42.0,<46.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real Vault on 127.0.0.1:8200",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_vault"
module-root = "src"
