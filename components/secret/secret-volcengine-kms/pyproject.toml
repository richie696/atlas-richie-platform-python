[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-volcengine-kms"
version = "0.2.0"
description = "Volcengine KMS-only backend for the Atlas Richie secret platform. Implements 2-SPI composite (KeyWrappingBackend via KMS + SecretProviderSession); 1:1 functional parity with Java atlas-richie-secret-provider-volcengine (SDK refactor, KMS-only)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
sdk = [
  "volcengine-python-sdk>=1.0,<2.0",
]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real Volcengine account (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_volcengine_kms"
module-root = "src"
