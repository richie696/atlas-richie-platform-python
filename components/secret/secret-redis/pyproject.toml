[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-redis"
version = "0.2.0"
description = "Redis backend for the Atlas Richie secret platform. Stores AES-256-GCM envelope-encrypted secret values in Redis, reusing the atlas-richie-cache-redis infrastructure for connection pooling, RedisStringManager, and RedisDistributedCache."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-cache-redis>=0.2.0,<0.3.0",
  "cryptography>=42.0,<46.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires real Redis on 127.0.0.1:16379",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_redis"
module-root = "src"
