[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-barbican"
version = "0.2.0"
description = "OpenStack Barbican secret backend for the Atlas Richie secret platform. Implements 3-SPI composite (SecretOperations via HTTP + SecretBootstrapClient + SecretProviderSession); 1:1 functional parity with Java atlas-richie-secret-provider-barbican."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real OpenStack Barbican instance (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_barbican"
module-root = "src"
