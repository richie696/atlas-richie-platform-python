[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-core"
version = "0.2.0"
description = "Framework-neutral secret management platform. 1:1 functional parity with Java atlas-richie-secret-parent (api / core / bootstrap / testkit / provider SPI / crypto envelope / local providers). Backend-agnostic; concrete remote backends (Redis, Vault, OpenBao, PKCS#11, AWS, Azure, GCP, ...) live in separate components."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-contracts>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
crypto = [
  "cryptography>=42.0,<46.0",
]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: multi-component interaction, may use real Redis or real KMS",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret"
module-root = "src"
