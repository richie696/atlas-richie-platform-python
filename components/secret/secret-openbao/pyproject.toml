[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-openbao"
version = "0.2.0"
description = "OpenBao backend for the Atlas Richie secret platform. Thin wrapper over atlas-richie-secret-vault; re-uses the hvac 2.x client and the 5-SPI composite against an OpenBao endpoint. Mirrors Java atlas-richie-secret-provider-openbao 1:1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-vault>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real OpenBao (or Vault) on 127.0.0.1:8200",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_openbao"
module-root = "src"
