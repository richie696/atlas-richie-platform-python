[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-azure-keyvault"
version = "0.2.0"
description = "Azure Key Vault backend for the Atlas Richie secret platform. Implements SecretOperations (Secrets API) + KeyWrappingBackend (Keys API wrap/unwrap) + SecretBootstrapClient + SecretProviderSession over azure-keyvault-secrets + azure-keyvault-keys SDKs. Mirrors Java atlas-richie-secret-provider-azure 1:1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "azure-identity>=1.18,<2.0",
  "azure-keyvault-secrets>=4.10,<5.0",
  "azure-keyvault-keys>=4.10,<5.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real Azure Key Vault (no local emulator exists)",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_azure_keyvault"
module-root = "src"
