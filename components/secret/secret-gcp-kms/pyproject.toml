[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-gcp-kms"
version = "0.2.0"
description = "Google Cloud Secret Manager + KMS backend for the Atlas Richie secret platform. Implements SecretOperations (Secret Manager API) + KeyWrappingBackend (KMS API encrypt/decrypt) + SecretBootstrapClient + SecretProviderSession. Mirrors Java atlas-richie-secret-provider-gcp 1:1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "google-cloud-secret-manager>=2.20,<4.0",
  "google-cloud-kms>=2.24,<4.0",
  "google-auth>=2.30,<3.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real GCP project (no local emulator exists)",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_gcp_kms"
module-root = "src"
