[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-pkcs11"
version = "0.2.0"
description = "PKCS#11 / HSM backend for the Atlas Richie secret platform. Implements KeyWrappingBackend (CKM_WRAPKEY+AES) + SigningBackend (CKM_SHA256_RSA_PKCS or CKM_ECDSA) + SecretBootstrapClient + SecretProviderSession over the python-pkcs11 SDK. Mirrors Java atlas-richie-secret-provider-pkcs11 1:1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "python-pkcs11>=0.10,<1.0",
  "asn1crypto>=1.5,<2.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires SoftHSM2 (set SOFTHSM2_CONF) on 127.0.0.1",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_pkcs11"
module-root = "src"
