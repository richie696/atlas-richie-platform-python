[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-aws-kms"
version = "0.2.0"
description = "AWS Secrets Manager + KMS backend for the Atlas Richie secret platform. Implements the 5-SPI composite (SecretOperations via SecretsManager + KeyWrappingBackend + SigningBackend via KMS + SecretBootstrapClient + SecretProviderSession); 1:1 functional parity with Java atlas-richie-secret-provider-aws."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "boto3>=1.34,<2.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real localstack (or AWS) on 127.0.0.1:4566",
    "e2e: end-to-end tests that may spin up servers, slower",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_aws_kms"
module-root = "src"
