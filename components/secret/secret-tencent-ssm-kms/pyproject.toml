[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "atlas-richie-secret-tencent-ssm-kms"
version = "0.2.0"
description = "Tencent Cloud SSM + KMS backend for the Atlas Richie secret platform. Implements 3-SPI composite (SecretOperations via SSM + KeyWrappingBackend via KMS + SecretBootstrapClient + SecretProviderSession); 1:1 functional parity with Java atlas-richie-secret-provider-tencent (SDK refactor)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Richie" }]
dependencies = [
  "atlas-richie-secret-core>=0.2.0,<0.3.0",
  "atlas-richie-contracts>=0.2.0,<0.3.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
sdk = [
  "tencentcloud-sdk-python-ssm>=3.1.0",
  "tencentcloud-sdk-python-kms>=3.1.0",
]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests with no I/O, no external dependencies (default)",
    "integration: requires a real Tencent Cloud account (skipped locally)",
]

[tool.uv.build-backend]
module-name = "atlas_richie.secret_tencent_ssm_kms"
module-root = "src"
